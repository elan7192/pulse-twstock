name: 更新資料並發布網站

on:
  schedule:
    - cron: '40 7 * * 1-5'   # 台北 15:40（收盤、處置與期貨行情公布後）
    - cron: '30 13 * * 1-5'  # 台北 21:30（融資融券、注意股、夜間公告）
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 測試
        run: npm test
      - name: 抓公開資料
        run: npm run fetch
        continue-on-error: true
      - name: 保存資料
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main || true
            git push
          fi
      - name: 建置網站
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
